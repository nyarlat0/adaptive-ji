[package]
name = "adaptive-ji"
version = "1.2.0"
edition = "2024"
license = "Unlicense"
description = "Linux MPE MIDI processor with adaptive JI and Scala scale import"

[dependencies]
adaptive-ji-core = { path = "crates/core", features = ["cli"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
adaptive-ji-runtime = { path = "crates/runtime" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
alsa = "0.11"

# Keep the ALSA timestamp fix reproducible; never patch the user's Cargo cache.
[patch.crates-io]
midir = { path = "vendor/midir" }

[workspace]
exclude = ["vendor/logic_nih_plug_egui", "vendor/logic_nih_plug"]
members = ["crates/core", "crates/runtime", "crates/plugin", "xtask"]
resolver = "2"

[patch."https://github.com/CuteDSP/logic_nih_plug"]
logic_nih_plug = { path = "vendor/logic_nih_plug" }
logic_nih_plug_egui = { path = "vendor/logic_nih_plug_egui" }

[package]
name = "adaptive-ji"
version = "0.3.0"
edition = "2024"
description = "Linux MIDI processor for roughness-aware adaptive just intonation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
midir = "0.11"

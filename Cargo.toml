[package]
name = "adaptive-ji"
version = "1.0.0"
edition = "2024"
description = "Linux MIDI processor with configurable 5/7/11-limit adaptive just intonation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
